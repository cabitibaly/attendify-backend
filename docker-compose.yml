services:
  attendify-gin:
    container_name: mysql-attendify
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendify
    ports:
      - 3312:3306
    volumes:
      - mysql-attendify:/var/lib/mysql
    networks:
      - app-network

  adminer-attendify:
    container_name: adminer-attendify
    image: adminer
    restart: unless-stopped
    ports:
      - 7080:8080
    networks:
      - app-network

  redis-attendify:
    container_name: redis-attendify
    image: redis:8.4.0-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    networks:
      - app-network
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-attendify:/data
      
volumes:
  mysql-attendify:
  redis-attendify:

networks:
  app-network:  